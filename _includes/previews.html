<div style="display:grid;gap:0.875rem;grid-template-columns:repeat(auto-fill,minmax(160px,5fr));">
  {% for item in include.items %}
    <a href="{{ item.url | relative_url }}"
       title="{{ item.title }}{% if item.author %} by {{ item.author }}{% endif %}"
       style="display:inline-flex;flex-direction:column;align-items:start;font:400 0.75rem var(--sans-serif);color:var(--theme-foreground);width:100%">

      <img alt="thumbnail" src="{{ item.thumbnail | relative_url }}" style="
        border: 1px solid var(--theme-foreground-faintest);
        border-radius: 4px;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        object-fit: cover;
      ">

      <div style="width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px">
        {{ item.title }}
      </div>
    </a>
  {% endfor %}
</div>

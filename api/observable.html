<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" as="style" href="https://nxrix.github.io/observable-renderer/notebook.css?{{ site.time | date: "%s%N" }}">
  <link rel="stylesheet" type="text/css" href="https://nxrix.github.io/observable-renderer/notebook.css?{{ site.time | date: "%s%N" }}">
  <script>
    (()=>{
      const root = document.documentElement;
      const resize = () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        root.style.setProperty("--vw",width+"px");
        root.style.setProperty("--vh",height+"px");
        root.style.setProperty("--vmin",(width<height?width:height)+"px");
        root.style.setProperty("--vmax",(width>height?width:height)+"px");
      }
      resize();
      window.addEventListener("resize",resize);
      const icons = [
        `<svg xmlns="http://www.w3.org/2000/svg"  width="16px" height="16px" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-28 346-160H160v-186L28-480l132-134v-186h186l134-132 134 132h186v186l132 134-132 134v186H614L480-28Zm0-252q83 0 141.5-58.5T680-480q0-83-58.5-141.5T480-680v400Zm0 140 100-100h140v-140l100-100-100-100v-140H580L480-820 380-720H240v140L140-480l100 100v140h140l100 100Zm0-340Z"/></svg>`,
        `<svg xmlns="http://www.w3.org/2000/svg"  width="16px" height="16px" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0 80q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z"/></svg>`,
        `<svg xmlns="http://www.w3.org/2000/svg"  width="16px" height="16px" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>`
      ];
      const themes = ["auto","light","dark"];
      let theme = localStorage.getItem("theme")||"auto";
      const applyTheme = (t) => {
        if (t === "auto") t = window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
        root.setAttribute("data-theme",t);
      }
      applyTheme(theme);
      document.addEventListener("DOMContentLoaded", () => {
        const e = document.querySelector("footer > div > div:last-child");
        const setTheme = (t) => {
          theme = t;
          localStorage.setItem("theme",t);
          applyTheme(t);
          e.querySelectorAll("button").forEach((btn,i) => {
            const b = themes[i]===t;
            //btn.style.background = b?"var(--c0)":"var(--c1)";
            //btn.style.color = b?"var(--ce)":"var(--c8)";
            btn.style.outline = b?"1px solid var(--theme-foreground-faintest)":"none";
            btn.style.zIndex = b?"2":"1";
          });
        }
        themes.forEach((t,i) => {
          const btn = document.createElement("button");
          btn.innerHTML = icons[i];
          btn.onclick = () => setTheme(t);
          e.appendChild(btn);
        });
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
          setTheme(theme);
        });
        setTheme(theme);
      });
    })();
  </script>
  <style>
    html { height: var(--vh); }
    body { margin: 0; padding: 32px 24px; }
    footer a {
      /*color: var(--ce) !important;
      text-decoration: underline !important;
      text-decoration-color: var(--ce) !important;*/
    }
    footer a:hover { text-decoration-color: var(--theme-foreground-focus) !important; }
    footer > div > div:last-child button {
      background: #0000;
      /*
      background: var(--c1);
      color: var(--c8);
      */
      display: flex;
      justify-content: center;
      align-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 12px;
      z-index: 1;
      cursor: pointer;
    }
    footer > div > div:last-child button:focus-visible {
      outline: 2px solid var(--theme-foreground-focus) !important;
      z-index: 3 !important;
    }
  </style>
  <title>Observable</title>
</head>
<body>
  <div style="display:flex;flex-direction:column;min-height:calc(var(--vh) - 64px)">
    <main style="width:100%;margin:0 auto"></main>
    <footer style="width:100%;max-width:var(--max-width);margin:auto auto 0 auto">
      <hr>
      <div style="height:24px;display:flex;font-family:var(--sans-serif);font-size:13px">
        <div style="margin:auto 0">
          Copyright <a href="https://github.com/nxrix" target="_blank">nxrix</a>
        </div>
        <div style="display:flex;height:100%;aspect-ratio:3;margin-left:auto;outline:1px solid var(--theme-foreground-faintest);border-radius:12px"></div>
      </div>
    </footer>
  </div>
  <script type="module">
    const id = location.hash.slice(1);
    if (!id) {
      document.querySelector("main").textContent = "No Observable notebook specified.";
    } else {
      const { default: define } = await import(
        `https://api.observablehq.com/${id}.js?v=4`
      );
      new Runtime().module(define, Inspector.into("main"));
    }
  </script>
</body>
</html>

---
layout: default
title: Pipe Organ
---
<style>
  #board {
    display: flex;
    flex-direction: column;
    gap: 4px;
    user-select: none;
    touch-action: none;
  }
  .row {
    display: flex;
    height: 120px;
    outline: 1px solid #000;
    border-radius: 4px;
  }
  .w, .b {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font: 8px monospace;
  }
  .w {
    flex: 1;
    position: relative;
    background: #fff;
    color: #000;
    border: 1px solid #000;
  }
  .b {
    position: absolute;
    top: 0;
    left: 66%;
    width: 68%;
    height: 62%;
    z-index: 1;
    background: #000;
    color: #fff;
  }
  .row > .w:first-child { border-radius: 4px 0 0 4px; }
  .row > .w:last-child { border-radius: 0 4px 4px 0; }
  .b { border-radius: 0 0 4px 4px; }
  .w.on { background: #fc6; }
  .b.on { background: #960; }
  @media (min-width: 900px) {
    .row { height: 190px; }
    .w, .b { font-size: 10px; }
  }
  button {
    background: var(--theme-foreground-faintest);
    border: 1px solid var(--theme-foreground-fainter);
    border-radius: 4px;
    padding: 2px 7px;
  }
  [aria-pressed=true] {
    background: #960;
    color: #fff;
    border-color: #c90;
  }
  input { accent-color: #c90; }
  #stops button { margin-right: 4px; }
</style>
<h1>Pipe Organ</h1>
<br>
<div id="board"></div>
<br>
<div id="stops"></div>
<br>
<div>
  <button id="play">Play</button>
  <input id="file" type="file" accept=".mid,.midi">
  <br>
  <input id="seek" type="range" min="0" max="1" step="0.001" value="0" style="width:100%;max-width:256px" hidden>
</div>
<br>
<label>Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.6"></label>
<br>
<label>Swell <input id="swell" type="range" min="0" max="1" step="0.01" value="1"></label>
<br>
<label>Room <input id="room" type="range" min="0" max="1" step="0.01" value="0.45"></label>
<br>
<label>Tremolo <input id="trem" type="range" min="0" max="1" step="0.01" value="0"></label>
<br>
<label>Tremolo speed <input id="speed" type="range" min="0" max="1" step="0.01" value="0.5"></label>
<script>
  const $ = (id) => document.getElementById(id);
  const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const typing = "awsedftgyhujkolp;";

  const harmonics = {
    sine: [1],
    flute: [1, 0.08, 0.02],
    quint: [1, 0.05, 0.5, 0.03],
    spitz: [1, 0.45, 0.25, 0.12, 0.06],
    pluck: [1, 0.5, 0.25, 0.12],
    gemshorn: [1, 0.35, 0.15, 0.06],
    diapason: [1, 0.6, 0.4, 0.3, 0.2, 0.12, 0.08, 0.05],
    string: [1, 0.7, 0.55, 0.45, 0.35, 0.3, 0.25, 0.2, 0.15, 0.12, 0.1, 0.08],
    gamba: [1, 0.9, 0.7, 0.55, 0.4, 0.3, 0.2, 0.15, 0.1],
    reed: [1, 0.9, 0.8, 0.7, 0.6, 0.5, 0.42, 0.36, 0.3, 0.25, 0.2, 0.16, 0.12, 0.1, 0.08],
    oboe: [1, 0.4, 0.9, 0.3, 0.6, 0.2, 0.4, 0.15, 0.25],
    krum: [1, 0.2, 0.8, 0.2, 0.5, 0.15, 0.3],
    vox: [1, 0.3, 0.5, 0.15, 0.25, 0.08]
  };

  const stop = (name, ratios, wave, gain, extra) => ({ name, ratios, wave, gain, on: false, ...extra });

  const groups = {
    Flutes: [
      stop("Bourdon 16'", [0.5], "flute", 0.9, { on: true }),
      stop("Quintaton 16'", [0.5], "quint", 0.5),
      stop("Stopped Flute 8'", [1], "flute", 0.8),
      stop("Flute 4'", [2], "flute", 0.5),
      stop("Spitzflute 4'", [2], "spitz", 0.4)
    ],
    Principals: [
      stop("Open Diapason 8'", [1], "diapason", 0.7, { on: true }),
      stop("Gemshorn 8'", [1], "gemshorn", 0.6),
      stop("Principal 4'", [2], "diapason", 0.45, { on: true }),
      stop("Fifteenth 2'", [4], "diapason", 0.28)
    ],
    Strings: [
      stop("Viola 8'", [1], "string", 0.4),
      stop("Gamba 8'", [1], "gamba", 0.4),
      stop("Celeste 8'", [1], "string", 0.4, { cents: 8 })
    ],
    Mutations: [
      stop("Nazard 2 2/3'", [3], "flute", 0.3),
      stop("Tierce 1 3/5'", [5], "flute", 0.2),
      stop("Larigot 1 1/3'", [6], "flute", 0.18),
      stop("Sesquialtera", [3, 5], "flute", 0.22),
      stop("Mixture", [4, 6, 8], "diapason", 0.16),
      stop("Cymbal", [8, 10, 12], "diapason", 0.1)
    ],
    Reeds: [
      stop("Bombarde 16'", [0.5], "reed", 0.35),
      stop("Trumpet 8'", [1], "reed", 0.3),
      stop("Tuba 8'", [1], "reed", 0.5),
      stop("Oboe 8'", [1], "oboe", 0.4),
      stop("Cromorne 8'", [1], "krum", 0.4),
      stop("Vox Humana 8'", [1], "vox", 0.45),
      stop("Clarion 4'", [2], "reed", 0.22)
    ],
    Special: [
      stop("Cornet", [1, 2, 3, 4, 5], "flute", 0.22),
      stop("Chimes", [1, 2.76, 5.4], "sine", 0.9, { decay: 3 }),
      stop("Harp", [1], "pluck", 1.4, { decay: 1.2 })
    ],
    Couplers: [
      { name: "Sub Octave", shift: -12, on: false },
      { name: "Super Octave", shift: 12, on: false }
    ],
    Pedal: [
      stop("Subbass 32'", [0.25], "flute", 1),
      stop("Subbass 16'", [0.5], "flute", 0.9),
      stop("Principal 16'", [0.5], "diapason", 0.6),
      stop("Bass Flute 8'", [1], "flute", 0.6),
      stop("Posaune 16'", [0.5], "reed", 0.4)
    ]
  };

  const { Couplers: couplers, Pedal: pedalStops, ...manual } = groups;
  const stops = Object.values(manual).flat();

  const song = [
    [[69, 57], 0.16], [[67, 55], 0.16], [[69, 57, 45], 1.7], [[], 0.3],
    [[67, 55], 0.16], [[65, 53], 0.16], [[64, 52], 0.16], [[62, 50], 0.16], [[61, 49], 0.16], [[62, 50, 38], 2.4]
  ];

  const voices = new Map();
  const waves = {};
  let ctx, master, bus, shutter, swell, wet, lfo, lfoGain, noise, pedal = { note: null, voice: null };

  const setup = () => {
    ctx = new AudioContext();
    master = ctx.createGain();
    bus = ctx.createGain();
    shutter = ctx.createBiquadFilter();
    swell = ctx.createGain();
    wet = ctx.createGain();
    lfoGain = ctx.createGain();
    lfo = ctx.createOscillator();
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -24;
    compressor.knee.value = 12;
    compressor.ratio.value = 10;
    compressor.attack.value = 0.005;
    compressor.release.value = 0.25;
    const hall = ctx.createConvolver();
    const length = ctx.sampleRate * 3.4;
    const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      impulse.getChannelData(c).set(Float32Array.from({ length }, (_, i) => (Math.random() * 2 - 1) * (1 - i / length) ** 3));
    }
    hall.buffer = impulse;
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    noise.getChannelData(0).set(Float32Array.from({ length: ctx.sampleRate }, () => Math.random() * 2 - 1));
    Object.entries(harmonics).forEach(([name, h]) => {
      waves[name] = ctx.createPeriodicWave(new Float32Array(h.length + 1), Float32Array.of(0, ...h));
    });
    shutter.type = "lowpass";
    lfo.connect(lfoGain).connect(bus.gain);
    lfo.start();
    bus.connect(shutter).connect(swell).connect(master);
    swell.connect(hall).connect(wet).connect(master);
    master.connect(compressor).connect(ctx.destination);
    update();
  };

  const update = () => {
    if (!ctx) return;
    master.gain.value = +$("vol").value;
    swell.gain.value = 0.2 + 0.8 * $("swell").value;
    shutter.frequency.value = 500 * 24 ** $("swell").value;
    wet.gain.value = $("room").value * 1.6;
    lfoGain.gain.value = $("trem").value * 0.25;
    lfo.frequency.value = 2 + $("speed").value * 7;
  };

  const unlock = () => {
    if (!ctx) setup();
    ctx.resume();
  };

  const light = (m, on) => {
    document.querySelectorAll(`[data-m="${m}"]`).forEach((e) => e.classList.toggle("on", on));
  };

  const sound = (parts, base) => {
    const t = ctx.currentTime;
    const out = ctx.createGain();
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(0.3, t + 0.045);
    out.connect(bus);

    const sources = parts.filter(([, f]) => f < 9000).map(([wave, f, level, cents = 0, decay]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.setPeriodicWave(waves[wave]);
      osc.frequency.value = f;
      osc.detune.value = (Math.random() - 0.5) * 6 + cents;
      gain.gain.setValueAtTime(level * 0.12, t);
      if (decay) gain.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      osc.connect(gain).connect(out);
      osc.start(t);
      return osc;
    });

    const puff = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const env = ctx.createGain();
    puff.buffer = noise;
    filter.type = "bandpass";
    filter.frequency.value = Math.min(base * 3, 8000);
    filter.Q.value = 3;
    env.gain.setValueAtTime(0.06, t);
    env.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    puff.connect(filter).connect(env).connect(out);
    puff.start(t, Math.random() * 0.5);
    puff.stop(t + 0.15);

    return { out, sources };
  };

  const silence = ({ out, sources }) => {
    const t = ctx.currentTime;
    out.gain.cancelScheduledValues(t);
    out.gain.setValueAtTime(out.gain.value, t);
    out.gain.setTargetAtTime(0, t, 0.07);
    sources.forEach((o) => o.stop(t + 0.6));
  };

  const updatePedal = () => {
    const active = pedalStops.filter((s) => s.on);
    const note = active.length && voices.size ? Math.min(...voices.keys()) : null;
    if (note === pedal.note) return;
    if (pedal.voice) silence(pedal.voice);
    const f = 440 * 2 ** ((note - 69) / 12);
    const parts = active.flatMap((s) => s.ratios.map((r) => [s.wave, f * r, s.gain]));
    pedal = { note, voice: note === null ? null : sound(parts, f) };
  };

  const noteOn = (m) => {
    unlock();
    if (voices.has(m)) return;
    const f = 440 * 2 ** ((m - 69) / 12);
    const parts = [];
    for (const c of [{ shift: 0, on: true }, ...couplers]) {
      if (!c.on) continue;
      for (const s of stops.filter((s) => s.on)) {
        for (const r of s.ratios) parts.push([s.wave, f * 2 ** (c.shift / 12) * r, s.gain, s.cents, s.decay]);
      }
    }
    voices.set(m, sound(parts, f));
    light(m, true);
    updatePedal();
  };

  const noteOff = (m) => {
    const v = voices.get(m);
    if (!v) return;
    silence(v);
    voices.delete(m);
    light(m, false);
    updatePedal();
  };

  const allOff = () => [...voices.keys()].forEach(noteOff);

  const refresh = () => {
    const held = [...voices.keys()];
    held.forEach(noteOff);
    held.forEach(noteOn);
  };

  Object.entries(groups).forEach(([name, list]) => {
    const row = document.createElement("div");
    row.append(name + ": ");
    list.forEach((s) => {
      const button = document.createElement("button");
      button.textContent = s.name;
      button.setAttribute("aria-pressed", s.on);
      button.onclick = () => {
        s.on = !s.on;
        button.setAttribute("aria-pressed", s.on);
        refresh();
      };
      row.append(button);
    });
    $("stops").append(row);
  });

  const parseMidi = (buffer) => {
    const view = new DataView(buffer);
    const division = view.getUint16(12);
    const tempos = [[0, 500000]];
    const events = [];
    let pos = 14;
    while (pos < view.byteLength && view.getUint32(pos) === 0x4d54726b) {
      const end = pos + 8 + view.getUint32(pos + 4);
      let tick = 0;
      let status = 0;
      pos += 8;
      const varLength = () => {
        let value = 0;
        let byte;
        do {
          byte = view.getUint8(pos++);
          value = (value << 7) | (byte & 0x7f);
        } while (byte & 0x80);
        return value;
      };
      while (pos < end) {
        tick += varLength();
        if (view.getUint8(pos) & 0x80) status = view.getUint8(pos++);
        if (status === 0xff) {
          const type = view.getUint8(pos++);
          const length = varLength();
          if (type === 0x51) tempos.push([tick, (view.getUint8(pos) << 16) | view.getUint16(pos + 1)]);
          pos += length;
        } else if (status === 0xf0 || status === 0xf7) {
          pos += varLength();
        } else {
          const type = status & 0xf0;
          const note = view.getUint8(pos++);
          const velocity = type === 0xc0 || type === 0xd0 ? 0 : view.getUint8(pos++);
          if ((status & 0x0f) === 9) continue;
          if (type === 0x90 && velocity > 0) events.push([tick, note, true]);
          else if (type === 0x80 || type === 0x90) events.push([tick, note, false]);
        }
      }
      pos = end;
    }
    tempos.sort((a, b) => a[0] - b[0]);
    const seconds = (tick) => {
      let time = 0;
      let last = 0;
      let tempo = 500000;
      for (const [at, value] of tempos) {
        if (at >= tick) break;
        time += (at - last) * tempo / division / 1e6;
        last = at;
        tempo = value;
      }
      return time + (tick - last) * tempo / division / 1e6;
    };
    return events.map(([tick, note, on]) => [seconds(tick), note, on]);
  };

  const playButton = $("play");
  const demoTrack = (() => {
    let time = 0;
    return song.flatMap(([notes, length]) => {
      const start = time;
      time += length;
      return notes.flatMap((note) => [[start, note, true], [start + length * 0.94, note, false]]);
    });
  })();
  let track = demoTrack;
  let timers = [];
  let playing = false;
  let position = 0;
  let startedAt = 0;

  const pause = () => {
    position += (performance.now() - startedAt) / 1000;
    timers.forEach(clearTimeout);
    timers = [];
    playing = false;
    allOff();
    playButton.textContent = "Play";
  };

  const play = () => {
    const end = track.reduce((max, [time]) => Math.max(max, time), 0);
    startedAt = performance.now();
    playing = true;
    playButton.textContent = "Pause";
    timers = track
      .filter(([time]) => time >= position)
      .map(([time, note, on]) => setTimeout(() => (on ? noteOn(note) : noteOff(note)), (time - position) * 1000));
    timers.push(setTimeout(() => {
      pause();
      position = 0;
      seek.value = 0;
      if (track === demoTrack) play();
    }, (end - position) * 1000 + 500));
  };

  playButton.onclick = () => (playing ? pause() : play());

  const seek = $("seek");
  const lastTime = (events) => events.reduce((max, [time]) => Math.max(max, time), 0);
  let songEnd = 0;

  seek.oninput = () => {
    const wasPlaying = playing;
    if (wasPlaying) pause();
    position = seek.value * songEnd;
    if (wasPlaying) play();
  };

  setInterval(() => {
    if (playing && songEnd && !seek.matches(":active")) {
      seek.value = (position + (performance.now() - startedAt) / 1000) / songEnd;
    }
  }, 200);

  $("file").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (playing) pause();
    track = parseMidi(await file.arrayBuffer());
    songEnd = lastTime(track);
    position = 0;
    seek.value = 0;
    seek.hidden = false;
    play();
    e.target.value = "";
  };

  const board = $("board");
  const wide = matchMedia("(min-width: 900px)");
  const isBlack = (m) => [1, 3, 6, 8, 10].includes(m % 12);

  const makeKey = (type, m) => {
    const key = document.createElement("div");
    key.className = type;
    key.dataset.m = m;
    //key.textContent = names[m % 12] + ((m / 12 | 0) - 1);
    return key;
  };

  const build = () => {
    const perRow = wide.matches ? 61 : 24;
    board.innerHTML = "";
    for (let first = 36; first <= 96; first += perRow) {
      const last = Math.min(first + perRow - 1, 96);
      const row = document.createElement("div");
      let whites = 0;
      row.className = "row";
      for (let m = first; m <= last; m++) {
        if (isBlack(m)) continue;
        const white = makeKey("w", m);
        if (m < last && isBlack(m + 1)) white.append(makeKey("b", m + 1));
        row.append(white);
        whites++;
      }
      if (!wide.matches) row.style.width = whites / 14 * 100 + "%";
      board.append(row);
    }
    voices.forEach((_, m) => light(m, true));
  };

  const touches = new Map();
  const noteAt = (e) => +document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-m]")?.dataset.m || null;
  const lift = (e) => {
    noteOff(touches.get(e.pointerId));
    touches.delete(e.pointerId);
  };

  board.onpointerdown = (e) => {
    const m = noteAt(e);
    if (!m) return;
    e.preventDefault();
    touches.set(e.pointerId, m);
    noteOn(m);
  };
  board.onpointermove = (e) => {
    const m = noteAt(e);
    const old = touches.get(e.pointerId);
    if (!old || !m || m === old) return;
    noteOff(old);
    touches.set(e.pointerId, m);
    noteOn(m);
  };
  addEventListener("pointerup", lift);
  addEventListener("pointercancel", lift);

  addEventListener("keydown", (e) => {
    const i = typing.indexOf(e.key.toLowerCase());
    if (i >= 0 && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) noteOn(48 + i);
  });
  addEventListener("keyup", (e) => {
    const i = typing.indexOf(e.key.toLowerCase());
    if (i >= 0) noteOff(48 + i);
  });
  addEventListener("blur", allOff);
  addEventListener("pointerdown", unlock);
  addEventListener("keydown", unlock);

  navigator.requestMIDIAccess?.()?.then((midi) => {
    const bind = () => midi.inputs.forEach((input) => {
      input.onmidimessage = ({ data: [status, note, velocity] }) => {
        const type = status & 0xf0;
        if (type === 0x90 && velocity > 0) noteOn(note);
        else if (type === 0x80 || type === 0x90) noteOff(note);
        else if (type === 0xb0 && note === 123) allOff();
      };
    });
    midi.onstatechange = bind;
    bind();
  }).catch(() => {});
  addEventListener("input", update);
  wide.onchange = build;
  build();
</script>
